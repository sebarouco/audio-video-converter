version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14
    container_name: ofc_postgres
    environment:
      POSTGRES_DB: online_file_converter
      POSTGRES_USER: converter_user
      POSTGRES_PASSWORD: converter_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ofc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converter_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ofc_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ofc_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ofc_backend
    ports:
      - "8080:8080"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../config:/app/config
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ofc_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ofc_network:
    driver: bridge